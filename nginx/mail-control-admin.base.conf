location = /admin/client {
    auth_request /internal/auth/user;
    error_page 401 403 = @sso_login;
    include /etc/nginx/proxy.conf;
    proxy_pass http://$admin;
    expires $expires;
}

location = /apple.mobileconfig {
    auth_request /internal/auth/user;
    error_page 401 403 = @sso_login;
    rewrite ^ /internal/autoconfig/apple break;
    include /etc/nginx/proxy.conf;
    proxy_pass http://$admin;
}

location = /mobileconfig {
    auth_request /internal/auth/user;
    error_page 401 403 = @sso_login;
    rewrite ^ /internal/autoconfig/apple break;
    include /etc/nginx/proxy.conf;
    proxy_pass http://$admin;
}

location = /admin/antispam {
    return 301 /admin/antispam/;
}

location ^~ /admin/antispam/ {
    rewrite ^/admin/antispam/(.*) /$1 break;
    auth_request /internal/auth/admin;
    error_page 401 403 = @sso_login;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-By "";
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    proxy_pass http://$antispam;
}

# Mailu native pages retain their original authentication and upstream.
location ^~ /admin/ {
    include /etc/nginx/proxy.conf;
    proxy_pass http://$admin;
    expires $expires;
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter "</body>" "<script>(function(){function run(){if(document.querySelector('.sidebar a[href=\"/admin/admin/list\"]')){var script=document.createElement('script');script.src='/admin/mail-control/navigation.js';document.head.appendChild(script)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run()})()</script></body>";
}
